name: Проверка каталога услуг

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установить Python-зависимости
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Проверить Django API
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test catalog -v 2
      - name: Подготовить отдельную учебную базу
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_catalog
          PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "::add-mask::$PASSWORD"
          echo "TEST_ADMIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "TEST_ADMIN_USER=admin" >> "$GITHUB_ENV"
          DJANGO_SUPERUSER_PASSWORD="$PASSWORD" python manage.py createsuperuser --noinput --username admin --email admin@example.test
          python manage.py runserver 127.0.0.1:8000 > "$RUNNER_TEMP/django.log" 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/services/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/django.log"
          exit 1
      - name: Установить frontend и собрать Vite
        working-directory: frontend
        run: |
          npm install
          npm run build
          npx playwright install --with-deps chromium
      - name: Выполнить восемь сквозных сценариев
        working-directory: frontend
        run: npm run test:e2e
      - name: Сохранить скриншоты и отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-screenshots
          path: |
            docs/screenshots/
            frontend/test-results/
          if-no-files-found: ignore
      - name: Добавить подтверждённые скриншоты в main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Добавить скриншоты успешной сквозной проверки"
            git push origin HEAD:main
          fi
